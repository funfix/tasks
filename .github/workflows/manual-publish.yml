name: manual-publish

on:
  workflow_dispatch:
    inputs:
      ref_to_publish:
        description: "Git ref to publish. Stable releases need refs/tags/vX.Y.Z."
        required: true
        type: string
        default: refs/heads/main
      stable_version:
        description: "Publish a stable version instead of a snapshot."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref_to_publish }}
          fetch-depth: 100

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish to Maven Central
        run: bash .github/scripts/release
        env:
          PUBLISH_STABLE_VERSION: ${{ inputs.stable_version }}
          RELEASE_REF: ${{ inputs.ref_to_publish }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
